<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Carta · Generatore di menu</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1A1A18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carta">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- Disabilita le estensioni tipo "Dark Reader" che invertono i colori a forza -->
<meta name="darkreader-lock">
<!-- Applica il tema salvato prima del primo paint (niente flash) -->
<script>(function(){try{var t=localStorage.getItem('ui.theme')||'light';document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
<!-- Service worker + auto-aggiornamento PWA -->
<script>
if('serviceWorker' in navigator){
  addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      reg.addEventListener('updatefound',function(){
        var nw=reg.installing; if(!nw) return;
        nw.addEventListener('statechange',function(){
          if(nw.state==='activated' && navigator.serviceWorker.controller) location.reload();
        });
      });
    }).catch(function(){});
  });
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Poppins:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Serif+JP:wght@200;300;400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<!-- Font del cliente "il baretto" (Cocktail & Wine Bar) — precaricati per evitare il flash sui titoli Bebas -->
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=GFS+Didot&family=Jost:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="menu-generator.css">
<template id="__bundler_thumbnail">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#F5EDD8"/>
  <line x1="20" y1="30" x2="80" y2="30" stroke="#C4A86A" stroke-width="0.6"/>
  <text x="50" y="58" text-anchor="middle" font-family="Palatino, serif" font-style="italic" font-size="20" fill="#1A1A18">Carta</text>
  <line x1="35" y1="70" x2="65" y2="70" stroke="#C4A86A" stroke-width="0.4"/>
  <text x="50" y="80" text-anchor="middle" font-family="monospace" font-size="4" letter-spacing="0.5" fill="#8C8880">GENERATORE DI MENU</text>
</svg>
</template>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="clients.js"></script>
<script src="menu-data.js"></script>
<script src="cambusa-bridge.js"></script>
<script src="sync.js"></script>
<script type="text/babel" src="menu-sheets.jsx"></script>
<script type="text/babel" src="menu-form.jsx"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useDeferredValue } = React;

// ---- client-aware loaders ----
function readClientFromURL(){
  try{
    const p = new URLSearchParams(location.search).get("client");
    if (p && CLIENTS[p]) return p;
  } catch(e){}
  return null;
}
function loadMenuFor(clientId){
  try{
    let saved = localStorage.getItem("menu." + clientId);
    // migrazione dalle vecchie chiavi (solo casa)
    if (!saved && clientId === "dalentini") saved = localStorage.getItem("dalentini.menu");
    if (saved) return normalizeMenu(JSON.parse(saved));
  } catch(e){}
  const cl = getClient(clientId);
  const key = cl.defaultPreset;
  if (key && PRESET_MENUS[key]) return JSON.parse(JSON.stringify(PRESET_MENUS[key]));
  return JSON.parse(JSON.stringify(EMPTY_MENU));
}
function loadVariantFor(clientId){
  return localStorage.getItem("variant." + clientId)
      || (clientId === "dalentini" && localStorage.getItem("dalentini.variant"))
      || "contemporaneo";
}
// Ogni scrittura passa di qui. Il localStorage resta la fonte — l'app funziona
// identica offline e senza token — ma il sincronizzatore viene avvisato, così
// la modifica raggiunge gli altri dispositivi senza che tu debba pensarci.
function saveKey(key, value){
  localStorage.setItem(key, value);
  if (window.CartaSync) CartaSync.bump(key, value);
}

function App(){
  // ---- state ----
  const [clientId, setClientId] = useState(() =>
    readClientFromURL() || localStorage.getItem("active.client") || DEFAULT_CLIENT);
  const client = getClient(clientId);

  const [menu, setMenu] = useState(() => loadMenuFor(clientId));
  const [variant, setVariant] = useState(() => loadVariantFor(clientId));

  const SHEETS = {
    classico: MenuClassico,
    contemporaneo: MenuContemporaneo,
    tabula: MenuTabula,
    editoriale: MenuEditoriale,
    diario: MenuDiario,
    listino: MenuListino
  };
  const VLABELS = {
    classico: "I · Classico",
    contemporaneo: "II · Contemporaneo",
    tabula: "III · Tabula",
    editoriale: "IV · Editoriale",
    diario: "V · Diario",
    listino: "VI · Listino"
  };
  const SheetComponent = SHEETS[variant] || MenuContemporaneo;
  // L'anteprima è pesante (impaginazione misurata su decine di pagine): la
  // aggiorniamo "in differita" così la digitazione nel form resta immediata.
  const previewMenu = useDeferredValue(menu);
  // ---- larghezza dell'editor, trascinabile come le finestre ----
  const EDITOR_W_DEF = 420;
  const [editorW, setEditorW] = useState(() => {
    const v = parseInt(localStorage.getItem("ui.editorW") || "", 10);
    return (v >= 260 && v <= 1200) ? v : EDITOR_W_DEF;
  });
  const splitRef = useRef(null);
  const startSplit = useCallback((e) => {
    if (e.button != null && e.button !== 0) return;
    e.preventDefault();
    const el = splitRef.current;
    if (el) el.classList.add("dragging");
    document.body.classList.add("split-dragging");
    let w = editorW;
    const onMove = (ev) => {
      const max = Math.max(320, window.innerWidth - 340);
      w = Math.max(260, Math.min(max, Math.round(ev.clientX)));
      setEditorW(w);
    };
    const onUp = () => {
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
      if (el) el.classList.remove("dragging");
      document.body.classList.remove("split-dragging");
      try { saveKey("ui.editorW", String(w)); } catch(err){}
    };
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
  }, [editorW]);
  const resetSplit = () => {
    setEditorW(EDITOR_W_DEF);
    try { saveKey("ui.editorW", String(EDITOR_W_DEF)); } catch(err){}
  };

  const [zoom, setZoom] = useState(0.55);
  const previewRef = useRef(null);
  const [pageCount, setPageCount] = useState(1);
  const [page, setPage] = useState(0);

  // ---- tema chiaro/scuro (default: chiaro) + vista mobile (editor/anteprima) ----
  const [theme, setTheme] = useState(() => {
    try { return localStorage.getItem("ui.theme") || "light"; } catch(e){ return "light"; }
  });
  const [mview, setMview] = useState("editor");
  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    try { saveKey("ui.theme", theme); } catch(e){}
  }, [theme]);

  // ---- client: font + url + persistenza attivo ----
  useEffect(() => {
    applyClientFonts(client);
    try{ saveKey("active.client", clientId); } catch(e){}
    try{
      const url = new URL(location.href);
      url.searchParams.set("client", clientId);
      history.replaceState(null, "", url);
    } catch(e){}
  }, [clientId]);

  // ---- persistence (per cliente) ----
  // Salvataggio ritardato: con liste lunghe scrivere a ogni tasto blocca la
  // digitazione. Se lo spazio finisce (foto pesanti) lo diciamo, non in silenzio.
  const [saveErr, setSaveErr] = useState(false);
  useEffect(() => {
    const t = setTimeout(() => {
      try{
        saveKey("menu." + clientId, JSON.stringify(menu));
        setSaveErr(false);
      } catch(e){ setSaveErr(true); }
    }, 400);
    return () => clearTimeout(t);
  }, [menu, clientId]);
  useEffect(() => {
    try{ saveKey("variant." + clientId, variant); } catch(e){}
  }, [variant, clientId]);

  // ---- memoria condivisa fra dispositivi ----
  // Quando arriva la memoria scritta altrove, il sincronizzatore ha già
  // riscritto il localStorage: qui l'app rilegge sé stessa, senza ricaricare
  // la pagina — niente lampo bianco e niente scroll perso.
  const [syncState, setSyncState] = useState(() => window.CartaSync ? CartaSync.status() : null);
  useEffect(() => {
    if (!window.CartaSync) return;
    const offState = CartaSync.onState(setSyncState);
    const offApplied = CartaSync.onApplied(({ startup }) => {
      // All'apertura si riprende dal cliente su cui eri sull'altro
      // dispositivo; se invece scarichi a metà lavoro, resti dove sei.
      const want = startup ? (localStorage.getItem("active.client") || clientId) : clientId;
      const next = CLIENTS[want] ? want : clientId;
      setMenu(loadMenuFor(next));
      setVariant(loadVariantFor(next));
      if (next !== clientId) setClientId(next);
      const t = localStorage.getItem("ui.theme");
      if (t === "light" || t === "dark") setTheme(t);
      const w = parseInt(localStorage.getItem("ui.editorW") || "", 10);
      if (w >= 260 && w <= 1200) setEditorW(w);
    });
    return () => { offState(); offApplied(); };
  }, [clientId]);

  // ---- switch client → carica il suo menù + variante ----
  const switchClient = useCallback((id) => {
    if (!CLIENTS[id] || id === clientId) return;
    setMenu(loadMenuFor(id));
    setVariant(loadVariantFor(id));
    setClientId(id);
  }, [clientId]);

  // ---- preview: fit alla LARGHEZZA (la pagina riempie la larghezza del pannello) ----
  const fitZoom = useCallback(() => {
    const pane = previewRef.current;
    if (!pane) return;
    const avail = pane.clientWidth - 96;          // larghezza pannello meno padding
    if (avail <= 0) return;                        // pannello nascosto (mobile): non ricalcolare
    const a4w = 210 * 3.7795275591;                // A4 = 210mm ≈ 793px @96dpi
    const target = Math.min(1, avail / a4w);
    setZoom(Math.max(0.3, Math.min(1, Math.round(target * 100) / 100)));
  }, []);
  // ---- preview: fit alla PAGINA INTERA (tutto il foglio visibile, centrato) ----
  const fitPage = useCallback(() => {
    const pane = previewRef.current;
    if (!pane) return;
    const tb = pane.querySelector(".preview-toolbar");
    const tbH = tb ? tb.offsetHeight : 48;
    const availW = pane.clientWidth - 96;
    const availH = pane.clientHeight - tbH - 64;
    if (availW <= 0 || availH <= 0) return;
    const MM = 3.7795275591;
    const target = Math.min(availW / (210 * MM), availH / (297 * MM));
    setZoom(Math.max(0.3, Math.min(1, Math.round(target * 100) / 100)));
  }, []);
  // Default a schermo = adatta alla larghezza, centrata (come prima): primo
  // render, resize, e quando l'anteprima torna visibile (mobile) o cambia variante.
  useEffect(() => {
    fitZoom();
    window.addEventListener("resize", fitZoom);
    return () => window.removeEventListener("resize", fitZoom);
  }, [fitZoom]);
  useEffect(() => { fitZoom(); }, [mview, variant, editorW, fitZoom]);

  // ---- conta le pagine renderizzate (per il navigatore) ----
  useEffect(() => {
    const pane = previewRef.current;
    if (!pane) return;
    const n = pane.querySelectorAll(".page-A4").length || 1;
    setPageCount(n);
    setPage(p => Math.min(p, n - 1));
  }, [menu, variant, clientId, mview]);

  // ---- marca la pagina corrente (centratura + stampa selettiva) ----
  useEffect(() => {
    const pane = previewRef.current;
    if (!pane) return;
    pane.querySelectorAll(".page-A4").forEach((el, i) => {
      if (i === page) el.setAttribute("data-current", "true");
      else el.removeAttribute("data-current");
    });
  }, [page, pageCount, menu, variant]);

  // ---- vai a una pagina e centrala nell'anteprima ----
  const goToPage = useCallback((p) => {
    const pane = previewRef.current;
    const list = pane ? pane.querySelectorAll(".page-A4") : [];
    const np = Math.max(0, Math.min(list.length - 1, p));
    setPage(np);
    if (list[np]) list[np].scrollIntoView({ behavior: "smooth", block: "center", inline: "center" });
  }, []);

  // ---- layout drag&drop (copertina) ----
  const setLayoutOffset = useCallback((id, off) => {
    setMenu(m => {
      const layout = { ...(m.layout || {}) };
      const cur = { ...(layout[variant] || {}) };
      if (!off || (off.x === 0 && off.y === 0)) delete cur[id]; else cur[id] = off;
      layout[variant] = cur;
      return { ...m, layout };
    });
  }, [variant]);
  const dragValue = { editable: true, zoom, onCommit: setLayoutOffset };

  // ---- MODALITÀ LIBERA: sposta/ingrandisci/nascondi qualunque blocco ----
  const freeOn = !!((menu.grid || {})[variant] || {}).free;
  const [freeSel, setFreeSel] = useState(null);
  const layoutCur = (menu.layout && menu.layout[variant]) || {};

  const updateFree = useCallback((id, patch) => {
    setMenu(m => {
      const layout = { ...(m.layout || {}) };
      const cur = { ...(layout[variant] || {}) };
      const v = { ...(cur[id] || {}), ...patch };
      if (!v.x && !v.y && (!v.s || v.s === 1) && !v.h) delete cur[id]; else cur[id] = v;
      layout[variant] = cur;
      return { ...m, layout };
    });
  }, [variant]);

  const toggleFree = () => setMenu(m => {
    const g = { ...(m.grid || {}) };
    g[variant] = { ...(g[variant] || {}), free: !freeOn };
    return { ...m, grid: g };
  });

  // applica sempre il layout salvato; aggancia il trascinamento solo se attivo
  useEffect(() => {
    const pane = previewRef.current;
    if (!pane || typeof tagFreeBlocks !== "function") return;
    // niente modalità libera e nessuna posizione salvata → nulla da fare
    if (!freeOn && !Object.keys(layoutCur).length) return;
    tagFreeBlocks(pane);
    applyFreeLayout(pane, layoutCur);
    pane.classList.toggle("free-mode", freeOn);
    if (!freeOn) return;
    return installFreeDrag(pane, {
      zoom, layout: layoutCur,
      onCommit: (id, off) => updateFree(id, off),
      onSelect: setFreeSel
    });
  });

  // evidenzia l'elemento selezionato
  useEffect(() => {
    const pane = previewRef.current;
    if (!pane) return;
    pane.querySelectorAll(".free-selected").forEach(el => el.classList.remove("free-selected"));
    if (freeOn && freeSel){
      pane.querySelectorAll(`[data-free-id="${freeSel}"]`).forEach(el => el.classList.add("free-selected"));
    }
  });

  const selVal = (freeSel && layoutCur[freeSel]) || {};
  const stepSize = (d) => updateFree(freeSel, { s: Math.max(0.4, Math.min(3, (selVal.s || 1) + d)) });
  const hasLayout = !!(menu.layout && menu.layout[variant] && Object.keys(menu.layout[variant]).length);
  const resetLayout = () => {
    setMenu(m => {
      const layout = { ...(m.layout || {}) };
      delete layout[variant];
      return { ...m, layout };
    });
  };

  // ---- actions ----
  const loadPreset = (key) => {
    // normalizeMenu → i preset ricevono tutti i campi predefiniti
    if (PRESET_MENUS[key]) setMenu(normalizeMenu(JSON.parse(JSON.stringify(PRESET_MENUS[key]))));
  };
  const resetMenu = () => {
    if (confirm("Sostituire il menù corrente con un menu vuoto?")){
      setMenu(normalizeMenu(JSON.parse(JSON.stringify(EMPTY_MENU))));
    }
  };
  const exportMenu = async (kind) => {
    const prefix = client.id;
    if (kind === "json"){
      const blob = new Blob([JSON.stringify(menu, null, 2)], { type: "application/json" });
      downloadBlob(blob, `${prefix}-${slug(menu.name)}.json`);
    } else if (kind === "cambusa"){
      // La fotografia parte dal disco, ma il cliente aperto lo prendiamo dalla
      // memoria viva: l'export non deve mai essere vecchio di mezzo secondo.
      const parts = {};
      try{
        for (let i = 0; i < localStorage.length; i++){
          const k = localStorage.key(i);
          if (k && k.indexOf("menu.") === 0) parts[k] = localStorage.getItem(k);
        }
      } catch(e){}
      parts["menu." + clientId] = JSON.stringify(menu);
      const data = CambusaBridge.build(parts);
      if (!data){ alert("Non c'è ancora nessun menù da esportare."); return; }
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      downloadBlob(blob, `carta-per-cambusa-${new Date().toISOString().slice(0, 10)}.json`);
    } else if (kind === "html"){
      const html = await buildStandaloneHTML(menu, variant, clientId, previewRef.current);
      const blob = new Blob([html], { type: "text/html" });
      downloadBlob(blob, `${prefix}-${slug(menu.name)}.html`);
    }
  };
  const printMenu = (scope) => {
    const app = document.querySelector(".app");
    if (app) app.setAttribute("data-print-scope", scope === "current" ? "current" : "all");
    window.print();
  };

  const zoomIn = () => setZoom(z => Math.min(1, Math.round((z + 0.05) * 100) / 100));
  const zoomOut = () => setZoom(z => Math.max(0.3, Math.round((z - 0.05) * 100) / 100));

  return (
    <div className="app" data-client={clientId} data-mview={mview} data-print-scope="all"
      style={{ "--editor-w": editorW + "px" }}>
      <Form
        menu={menu}
        setMenu={setMenu}
        variant={variant}
        setVariant={setVariant}
        client={client}
        setClient={switchClient}
        onLoadPreset={loadPreset}
        onReset={resetMenu}
        onPrint={printMenu}
        onExport={exportMenu}
      />
      <div className="split-handle" ref={splitRef} onPointerDown={startSplit}
        onDoubleClick={resetSplit} role="separator" aria-orientation="vertical"
        title="Trascina per ridimensionare · doppio clic per reimpostare"></div>

      <div className="preview-pane" ref={previewRef} data-client={clientId}>
        <div className="preview-toolbar">
          <div className="ptb-dot"></div>
          <span className="ptb-hide-sm">{client.name} · {VLABELS[variant]}</span>
          <div className="ptb-spacer ptb-hide-sm"></div>

          {pageCount > 1 && (
            <div className="ptb-pages">
              <button onClick={() => goToPage(page - 1)} disabled={page <= 0}
                title="Pagina precedente" aria-label="Pagina precedente">‹</button>
              <span className="ptb-pageval">{page + 1}/{pageCount}</span>
              <button onClick={() => goToPage(page + 1)} disabled={page >= pageCount - 1}
                title="Pagina successiva" aria-label="Pagina successiva">›</button>
              <button className="ptb-printpage" onClick={() => printMenu("current")}
                title="Stampa solo questa pagina" aria-label="Stampa solo questa pagina">
                <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
              </button>
            </div>
          )}

          <div className="ptb-zoom">
            <button onClick={zoomOut} title="Riduci zoom" aria-label="Riduci zoom">−</button>
            <span className="z-val">{Math.round(zoom * 100)}%</span>
            <button onClick={zoomIn} title="Aumenta zoom" aria-label="Aumenta zoom">+</button>
          </div>

          <div className="ptb-spacer"></div>

          <button className={"ptb-theme ptb-free " + (freeOn ? "on" : "")} onClick={toggleFree}
            title={freeOn ? "Esci dalla modalità libera" : "Modalità libera: sposta e ridimensiona gli elementi"}
            aria-pressed={freeOn}>✥</button>

          {freeOn && freeSel && (
            <div className="ptb-freebar">
              <button onClick={() => stepSize(-0.1)} title="Riduci il testo">A−</button>
              <span className="ptb-freeval">{Math.round((selVal.s || 1) * 100)}%</span>
              <button onClick={() => stepSize(+0.1)} title="Ingrandisci il testo">A+</button>
              <button onClick={() => updateFree(freeSel, { h: !selVal.h })}
                title={selVal.h ? "Mostra" : "Nascondi"}>{selVal.h ? "◯" : "◉"}</button>
              <button onClick={() => { updateFree(freeSel, { x: 0, y: 0, s: 1, h: false }); }}
                title="Reimposta questo elemento">⤺</button>
            </div>
          )}

          {saveErr && (
            <span className="ptb-warn" title="Spazio del browser esaurito: il menù non viene più salvato. Alleggerisci le foto o esporta in JSON.">
              ⚠ non salvato
            </span>
          )}
          {syncState && syncState.hasToken && (
            <button
              className={"ptb-theme ptb-sync " + (syncState.busy ? "busy" : syncState.error ? "err" : syncState.dirty ? "dirty" : "ok")}
              onClick={() => { CartaSync.syncNow().catch(() => {}); }}
              title={syncState.busy ? "Sincronizzazione in corso…"
                : syncState.error ? "Sincronizzazione ferma — " + syncState.error
                : syncState.dirty ? "Modifiche non ancora inviate · clicca per sincronizzare"
                : "Memoria allineata su tutti i dispositivi"}
              aria-label="Sincronizza la memoria">⇅</button>
          )}
          {hasLayout && (
            <button className="ptb-theme" onClick={resetLayout}
              title="Reimposta le posizioni della copertina" aria-label="Reimposta posizioni copertina">⤺</button>
          )}
          <button
            className="ptb-theme"
            onClick={() => setTheme(t => (t === "light" ? "dark" : "light"))}
            title={theme === "light" ? "Menù scuro (a schermo)" : "Menù chiaro"}
            aria-label={theme === "light" ? "Passa al menù scuro" : "Passa al menù chiaro"}>
            {theme === "light" ? "☾" : "☀"}
          </button>
          <button className="ptb-print" onClick={() => printMenu("all")}
            title="Stampa / Salva come PDF (tutte le pagine)" aria-label="Stampa o salva come PDF, tutte le pagine">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
            <span className="ptb-print-lbl">PDF</span>
          </button>
        </div>
        <div className="sheet-stack" style={{ transform: `scale(${zoom})`, transformOrigin: "top center" }}>
          <DragCtx.Provider value={dragValue}>
            <SheetComponent menu={previewMenu} client={client} />
          </DragCtx.Provider>
        </div>
      </div>
      <div className="drag-guide-layer" id="dragGuideLayer" aria-hidden="true"></div>

      <nav className="mobile-tabs" aria-label="Sezioni">
        <button className={"mobile-tab " + (mview === "editor" ? "active" : "")}
          onClick={() => setMview("editor")} aria-pressed={mview === "editor"}>✎ Editor</button>
        <button className={"mobile-tab " + (mview === "preview" ? "active" : "")}
          onClick={() => setMview("preview")} aria-pressed={mview === "preview"}>▭ Anteprima</button>
      </nav>
    </div>
  );
}

// ---- utility ----
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function slug(s){
  return (s || "menu")
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/(^-|-$)/g, "");
}
// Export HTML VERAMENTE standalone: incorpora il CSS e le pagine già
// renderizzate (niente React/Babel, niente file affiancati). Il file si apre
// ovunque — anche offline, anche mandato per email alla stamperia.
async function buildStandaloneHTML(menu, variant, clientId, pane){
  const cl = getClient(clientId);
  const clientFonts = cl.fonts ? `\n<link href="${cl.fonts}" rel="stylesheet">` : "";

  let css = "";
  try { css = await (await fetch("menu-generator.css", { cache: "reload" })).text(); } catch(e){}

  let body = "";
  const sheet = pane && pane.querySelector(".sheet");
  if (sheet){
    const clone = sheet.cloneNode(true);
    // ripulisce gli agganci dell'editor (drag, tooltip, pagina corrente)
    clone.querySelectorAll(".draggable").forEach(el => {
      el.classList.remove("editable", "dragging");
      el.removeAttribute("title");
    });
    clone.querySelectorAll("[data-current]").forEach(el => el.removeAttribute("data-current"));
    body = clone.outerHTML;
  }

  return `<!DOCTYPE html>
<html lang="it" data-theme="light"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${menu.name} · ${cl.name}</title>
<meta name="color-scheme" content="light"><meta name="darkreader-lock">
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Poppins:ital,wght@0,300;0,400;1,300;1,400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">${clientFonts}
<style>
${css}
/* --- adattamenti per il file esportato --- */
html,body{background:#fff;height:auto;overflow:auto;margin:0}
.app{display:block;width:auto;height:auto}
.sheet{transform:none!important;gap:24px;padding:24px 0}
.page-A4{margin:0 auto;box-shadow:0 8px 24px rgba(0,0,0,.12)}

/* --- lettura da smartphone (QR): il foglio A4 diventa fluido --- */
@media screen and (max-width:820px){
  html{-webkit-text-size-adjust:100%}
  .sheet{gap:0;padding:0}
  .page-A4{
    width:auto!important;max-width:100%;height:auto!important;min-height:0!important;
    box-shadow:none;border:none;margin:0;overflow:visible!important;--fs:1.45;
  }
  /* niente colonne su schermo stretto: si legge scorrendo */
  .lst-body,.dishes-c,.dishes-m,.tab-dishes,.page-A4 [style*="column-count"]{
    column-count:1!important;columns:auto!important;
  }
  /* le posizioni fatte a mano valgono per l'A4, non per il telefono */
  .page-A4 [data-free-id]{transform:none!important;font-size:inherit!important}
  .inner-page-c,.inner-page-m,.tabula-page,.ed-page,.dr-page,.lst-page{
    padding:16px 14px!important;display:block!important;height:auto!important;
  }
  .cover-page-c,.cover-page-m,.ed-cover,.dr-cover{padding:26px 16px!important;height:auto!important}
  .area-band{margin-bottom:14px}
  .lst-group{margin-bottom:14px}
  .area-band-inline{column-span:none!important}
}

@media print{
  .sheet{gap:0;padding:0}
  .page-A4{box-shadow:none;border:none;margin:0 auto;break-after:page;page-break-after:always;break-inside:avoid;page-break-inside:avoid}
  .page-A4:last-child{break-after:avoid;page-break-after:avoid}
}
</style>
</head><body>
<div class="app" data-client="${clientId}" data-print-scope="all">${body}</div>
</body></html>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
